pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,md,yml,yaml}"
      run: pnpm exec prettier --check {staged_files}
    lint:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: pnpm exec eslint --max-warnings=0 {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    unit-tests:
      run: pnpm turbo run test:unit --filter='...[origin/dev]'
